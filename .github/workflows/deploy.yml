name: Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional build number override (defaults to GitHub run number)'
        required: false

concurrency:
  group: appstore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      WORKSPACE: Mana.xcworkspace
      SCHEME: Mana
      BUNDLE_ID: com.coby.mana
      TEAM_ID: 3Y8YH8GWMM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: tuist-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift') }}
          restore-keys: |
            tuist-${{ runner.os }}-

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew install --formula tuist

      - name: Setup signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:codesign -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(grep -aA1 UUID "$PROFILE_PATH" | grep -o "[-A-Z0-9]\{36\}" | head -n 1)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Resolve provisioning profile name
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Generate project
        run: bash Scripts/setup.sh

      - name: Compute build number
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "BUILD_NUMBER=${{ github.event.inputs.build_number }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Render ExportOptions.plist
        run: |
          sed -e "s|__TEAM_ID__|${TEAM_ID}|g" \
              -e "s|__BUNDLE_ID__|${BUNDLE_ID}|g" \
              -e "s|__PROFILE_NAME__|${PROFILE_NAME}|g" \
              .github/ExportOptions.template.plist > "$RUNNER_TEMP/ExportOptions.plist"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Mana.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mana.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/Mana.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app.keychain-db" || true
